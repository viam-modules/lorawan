version: "2"
run:
  timeout: 900s
  modules-download-mode: readonly
linters:
  default: all
  disable:
    - asasalint
    - containedctx
    - contextcheck
    - cyclop
    - depguard
    - err113
    - exhaustruct
    - forcetypeassert
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - gocyclo
    - godox
    - gomodguard # gomodguard is deprecated in favor of gomodguard_v2
    - importas
    - interfacebloat
    - ireturn
    - maintidx
    - makezero
    - mnd
    - musttag
    - nakedret
    - nestif
    - nlreturn
    - noinlineerr
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - prealloc
    - tagliatelle
    - testpackage
    - thelper # false positives
    - unqueryvet
    - varnamelen
    - wrapcheck
    - wsl # deprecated in favor of wsl_v5
    - wsl_v5
  settings:
    errcheck:
      check-blank: true
    funcorder:
      struct-method: false # keep helpers next to the exported methods that use them
    govet:
      disable:
        - fieldalignment
        - shadow
        - composites
      enable-all: true
    lll:
      line-length: 140
    revive:
      rules:
        - name: blank-imports
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
        - name: var-naming
  exclusions:
    generated: lax
    rules:
      - linters:
          - dupword
          - errcheck
          - exhaustive
          - goconst
          - gosec
        path: _test\.go$
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
    gofumpt:
      extra-rules: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
